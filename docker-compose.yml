# Starts the PostgreSQL database and the H-Copilot backend together
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: hcopilot
      POSTGRES_PASSWORD: hcopilot
      POSTGRES_DB: hcopilot
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hcopilot"]
      interval: 5s
      retries: 10

  backend:
    build: .
    environment:
      DATABASE_URL: postgresql://hcopilot:hcopilot@db:5432/hcopilot
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
